<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login do NeonGate Converter, conversor universal SaaS.">
  <title>NeonGate Converter | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-scene">
    <nav class="login-topbar" aria-label="Navegação principal">
      <a class="brand" href="/" aria-label="NeonGate">
        <span class="brand-mark">NG</span>
        <span>NeonGate Converter</span>
      </a>
      <span class="status-chip">converter cloud online</span>
    </nav>

    <section class="login-card" aria-label="Área de login">
      <div class="auth-heading">
        <p class="eyebrow">universal converter</p>
        <h1>Login</h1>
        <p>Entre para acessar sua central de conversões, histórico e plano.</p>
      </div>

      <form class="auth-form" data-endpoint="/api/login" data-loading-label="Entrando..." data-success-label="Acesso liberado. Abrindo dashboard..." data-button-label="Entrar" novalidate>
        <label class="field">
          <span>E-mail</span>
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16v12H4z"/>
              <path d="m4 7 8 6 8-6"/>
            </svg>
            <input type="email" name="email" placeholder="MeuEmail@meu.com" autocomplete="email" required>
          </span>
          <small class="field-message">Digite um email válido.</small>
        </label>

        <label class="field">
          <span>Senha</span>
          <span class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 11V8a5 5 0 0 1 10 0v3"/>
              <path d="M6 11h12v9H6z"/>
            </svg>
            <input type="password" name="password" placeholder="MinhaSenha123" autocomplete="current-password" minlength="6" required>
            <button class="password-toggle" type="button" aria-label="Mostrar senha">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 3 18 18"/>
                <path d="M7.4 7.4C4.4 9 2.5 12 2.5 12S6 18.5 12 18.5c1.8 0 3.4-.6 4.8-1.4"/>
                <path d="M14.1 5.8c4.6.9 7.4 6.2 7.4 6.2a17 17 0 0 1-2.1 2.8"/>
              </svg>
            </button>
          </span>
          <small class="field-message">A senha precisa ter pelo menos 6 caracteres.</small>
        </label>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" checked>
            <span>Lembrar senha</span>
          </label>
          <a href="#">Esqueci a senha</a>
        </div>

        <button class="submit-btn" type="submit">
          <span>Entrar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>
        </button>
      </form>

      <p class="signup-copy">Não tem conta? <a href="signup.html">Cadastre-se</a></p>
    </section>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
